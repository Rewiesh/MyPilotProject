<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 11 — DOM Manipulatie</title>
    <style>
        body { font-family: sans-serif; padding: 24px; max-width: 700px; margin: 0 auto; }
        h1 { color: #2563eb; }
        .kaart { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin: 12px 0; }
        .actief { background-color: #dbeafe; border-color: #2563eb; }
        .verborgen { display: none; }
        #uitvoer { background: #f1f5f9; padding: 12px; border-radius: 6px; min-height: 40px; }
        button { margin: 4px; padding: 8px 14px; cursor: pointer; border-radius: 6px; border: 1px solid #888; }
        ul#dynamischeLijst { list-style: disc; padding-left: 24px; }
    </style>
</head>
<body>

    <h1 id="hoofdTitel">DOM Demo</h1>
    <p id="ondertitel">Hier zie je live DOM-manipulatie.</p>

    <section class="kaart">
        <h2>1. Tekst & Stijl aanpassen</h2>
        <button onclick="veranderTitel()">Verander titel</button>
        <button onclick="verkleurTitel()">Verkleur titel</button>
        <button onclick="verbergOndertitel()">Verberg ondertitel</button>
        <button onclick="toonOndertitel()">Toon ondertitel</button>
    </section>

    <section class="kaart" id="kaartKlasse">
        <h2>2. CSS-klassen toggelen</h2>
        <button onclick="activeerKaart()">Activeer kaart</button>
        <button onclick="deactiveerKaart()">Deactiveer kaart</button>
        <button onclick="toggleKaart()">Toggle actief</button>
    </section>

    <section class="kaart">
        <h2>3. Elementen aanmaken</h2>
        <input type="text" id="invoerVak" placeholder="Typ een item...">
        <button onclick="voegItemToe()">Voeg toe</button>
        <ul id="dynamischeLijst"></ul>
    </section>

    <section class="kaart">
        <h2>4. DOM doorzoeken</h2>
        <button onclick="zoekAlleKnoppen()">Tel alle knoppen</button>
        <p id="uitvoer">Klik op een knop om resultaat te zien.</p>
    </section>

    <script src="demo-dom.js"></script>
</body>
</html>
